name: Review and release public site
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the reviewed build to Production (owner approval required)'
        type: boolean
        default: false
        required: true
      package:
        description: 'Candidate or reviewed rollback of frontend e4b9b33 (backend is separate)'
        type: choice
        options:
          - candidate
          - rollback-baseline
        default: candidate
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - if: ${{ inputs.package != 'rollback-baseline' }}
        run: npm run build:site
      - if: ${{ inputs.package != 'rollback-baseline' }}
        run: |
          npm run test:site-build
          node tests/publication_privacy.js --candidate
      - if: ${{ inputs.package == 'rollback-baseline' }}
        run: npm run build:rollback
      - if: ${{ inputs.package == 'rollback-baseline' }}
        run: |
          node tests/site_build.js --rollback
          node tests/publication_privacy.js --rollback
      - run: npm run test:minified
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ inputs.package == 'rollback-baseline' && 'dist-rollback' || 'dist' }}
          retention-days: 30
  deploy:
    if: ${{ inputs.deploy }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
